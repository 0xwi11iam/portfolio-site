  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var slug = (params.get('slug') || '').replace(/[^a-z0-9-]/gi, '');
      var titleEl = document.getElementById('title');
      var metaEl = document.getElementById('meta');
      var bodyEl = document.getElementById('body');

      if (!slug) {
        titleEl.textContent = 'Post not found';
        return;
      }

      fetch('content/posts.json')
        .then(function (r) { return r.json(); })
        .then(function (posts) {
          var meta = posts.filter(function (p) { return p.slug === slug; })[0];
          if (!meta) throw new Error('missing');
          document.title = (meta.title || 'Post') + ' — 0xwi11iam';
          titleEl.textContent = meta.title || 'Untitled';

          var bits = [];
          if (meta.date) {
            var d = new Date(meta.date + 'T00:00:00');
            bits.push(isNaN(d) ? meta.date : d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }));
          }
          if (meta.author) bits.push(meta.author);
          metaEl.innerHTML = '';
          bits.forEach(function (b) {
            var span = document.createElement('span');
            span.textContent = b;
            metaEl.appendChild(span);
          });

          return fetch('content/posts/' + slug + '/index.md');
        })
        .then(function (r) {
          if (!r || !r.ok) throw new Error('missing');
          return r.text();
        })
        .then(function (md) {
          if (window.marked) {
            bodyEl.innerHTML = marked.parse(md);
          } else {
            var pre = document.createElement('pre');
            pre.textContent = md;
            bodyEl.appendChild(pre);
          }
          // Fix relative asset paths so images, videos, etc. resolve from the root /assets/ folder
          var base = '/assets/';
          bodyEl.querySelectorAll('img, video, source, audio').forEach(function (el) {
            var val = el.getAttribute('src');
            if (val && !val.match(/^(https?:|data:|#|\/)/i)) el.setAttribute('src', base + val);
          });
          bodyEl.querySelectorAll('a[href]').forEach(function (el) {
            var val = el.getAttribute('href');
            if (val && !val.match(/^(https?:|data:|#|\/|mailto:)/i)) el.setAttribute('href', base + val);
          });

          // Syntax-highlight code blocks (skip mermaid)
          bodyEl.querySelectorAll('pre code').forEach(function (el) {
            if (el.className && el.className.indexOf('language-mermaid') !== -1) return;
            if (window.hljs) {
              try { hljs.highlightElement(el); } catch (e) {}
            }
          });

          // Render Mermaid diagrams
          if (window.mermaid) {
            mermaid.initialize({
              startOnLoad: false,
              securityLevel: 'loose',
              theme: 'base',
              themeVariables: {
                fontFamily: "'SF Mono','Fira Code',Menlo,Consolas,monospace",
                fontSize: '13px',
                background: 'transparent',
                primaryColor: '#1a1a1e',
                primaryTextColor: '#e4e4e7',
                primaryBorderColor: '#3b82f6',
                lineColor: '#06b6d4',
                secondaryColor: '#16161a',
                tertiaryColor: '#16161a',
                clusterBkg: 'rgba(26, 26, 30, 0.6)',
                clusterBorder: '#3f3f46',
                edgeLabelBackground: '#1a1a1e',
                nodeTextColor: '#e4e4e7'
              }
            });
            var mermaidCodes = bodyEl.querySelectorAll('pre code.language-mermaid');
            Array.prototype.forEach.call(mermaidCodes, function (code) {
              var pre = code.parentNode;
              var container = document.createElement('div');
              container.className = 'mermaid';
              container.textContent = code.textContent;
              if (pre && pre.tagName === 'PRE') pre.replaceWith(container);
            });
            var mermaidNodes = bodyEl.querySelectorAll('.mermaid');
            if (mermaidNodes.length) {
              mermaid.run({ nodes: Array.prototype.slice.call(mermaidNodes) }).catch(function () {});
            }
          }
        })
        .catch(function () {
          titleEl.textContent = 'Post not found';
          bodyEl.innerHTML = '<p>That post could not be loaded. <a href="/blog.html">Browse all posts</a>.</p>';
        });
    })();
  </script>
